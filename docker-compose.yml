services:
  raee-optimizer:
    build: .
    image: raee-optimizer:latest
    container_name: raee-optimizer
    restart: unless-stopped
    ports:
      # BIND_IP=0.0.0.0 (default) publica al exterior. En modo HTTPS se pone
      # 127.0.0.1 para que el único acceso público sea Caddy por 443.
      - "${BIND_IP:-0.0.0.0}:${PORT:-8501}:8501"
    environment:
      # Contraseña de acceso. Se lee del archivo .env del proyecto (o del entorno).
      # Sin valor, la app queda SIN login (solo para desarrollo local).
      - APP_PASSWORD=${APP_PASSWORD:-}
      # Modo demo (reunión): DEMO_MODE=1 + DEMO_PIN=xxxx → solo Inventario y Demo, con PIN.
      - DEMO_MODE=${DEMO_MODE:-}
      - DEMO_PIN=${DEMO_PIN:-}
    # Para regenerar el artefacto del histórico sin reconstruir la imagen,
    # montá el repo y corré: docker compose exec raee-optimizer \
    #   python -m analysis.build_analysis
